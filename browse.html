<main class="page">
  <div class="page-content">
    <div class="container">

      <div class="breadcrumb" id="breadcrumb"></div>

      <div class="subjects-header" id="page-header"></div>

      <!-- Search -->
      <div class="search-bar" style="max-width:380px;margin:0 0 32px">

<!-- ── PDF Viewer Overlay ───────────────────────────────────── -->
<div id="viewer-overlay">
  <div class="viewer-toolbar">
    <div class="viewer-title" id="viewer-title">Document</div>
    <div class="viewer-nav">
      <button class="viewer-btn" id="viewer-prev" title="Previous page">‹</button>
      <span class="viewer-page-info" id="viewer-page-info">— / —</span>
      <button class="viewer-btn" id="viewer-next" title="Next page">›</button>
      <a id="viewer-dl-btn" href="#" download class="btn btn-dl" style="font-size:0.75rem;padding:6px 12px">⬇ Download</a>
      <button class="viewer-close" id="viewer-close" title="Close (Esc)">✕</button>
    </div>
  </div>

  <div class="flipbook-container">
    <button class="flip-arrow flip-prev" id="flip-prev" disabled>‹</button>
    <div class="flipbook" id="flipbook"></div>
    <button class="flip-arrow flip-next" id="flip-next" disabled>›</button>
  </div>
</div>

<footer>
